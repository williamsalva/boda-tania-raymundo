<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" fill="none">
  <defs>
    <!-- Gradientes Pétalos Borgoña / Vino -->
    <radialGradient id="vinoPetalo" cx="40%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#c94a91" />
      <stop offset="45%" stop-color="#9b2548" />
      <stop offset="90%" stop-color="#69102c" />
      <stop offset="100%" stop-color="#4a1830" />
    </radialGradient>
    <radialGradient id="vinoOscuro" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#9b2548" />
      <stop offset="70%" stop-color="#5a0e24" />
      <stop offset="100%" stop-color="#3d0717" />
    </radialGradient>

    <!-- Gradientes Rosa Empolvado / Rubor -->
    <radialGradient id="rosaRubor" cx="45%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fff5f8" />
      <stop offset="40%" stop-color="#f5c2d8" />
      <stop offset="85%" stop-color="#d9729f" />
      <stop offset="100%" stop-color="#b02a80" />
    </radialGradient>

    <!-- Gradientes Hojas Verde Eucalipto / Salvia -->
    <linearGradient id="eucalipto" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#96b299" />
      <stop offset="50%" stop-color="#648369" />
      <stop offset="100%" stop-color="#46604a" />
    </linearGradient>
    <linearGradient id="eucaliptoClaro" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c2d5c4" />
      <stop offset="70%" stop-color="#8ba58e" />
      <stop offset="100%" stop-color="#5a765e" />
    </linearGradient>

    <!-- Gradiente Dorado Sutil -->
    <linearGradient id="oro" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf4db" />
      <stop offset="50%" stop-color="#dfb76c" />
      <stop offset="100%" stop-color="#a87f32" />
    </linearGradient>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#4a1830" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- ================= RAMITAS LATERALES Y HOJAS DE EUCALIPTO ================= -->
  <!-- Ramitas izquierda -->
  <g opacity="0.95">
    <!-- Tallo izquierdo -->
    <path d="M260 130 C 200 125, 120 110, 50 145" stroke="#5a765e" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M190 123 C 150 95, 100 80, 40 85" stroke="#5a765e" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Hojas izquierda alargadas eucalipto -->
    <path d="M50 145 C 30 130, 45 110, 70 125 C 90 138, 70 155, 50 145 Z" fill="url(#eucalipto)" />
    <path d="M95 120 C 75 100, 95 80, 115 100 C 130 115, 115 135, 95 120 Z" fill="url(#eucaliptoClaro)" />
    <path d="M140 120 C 120 95, 135 75, 160 95 C 180 110, 160 135, 140 120 Z" fill="url(#eucalipto)" />
    <path d="M40 85 C 20 70, 35 50, 60 65 C 80 78, 60 95, 40 85 Z" fill="url(#eucaliptoClaro)" />
    <path d="M85 83 C 70 60, 90 40, 110 60 C 125 75, 105 95, 85 83 Z" fill="url(#eucalipto)" />
    <path d="M135 95 C 120 70, 140 50, 160 70 C 175 85, 155 105, 135 95 Z" fill="url(#eucaliptoClaro)" />

    <!-- Bayas doradas y vino izquierda -->
    <circle cx="110" cy="140" r="4.5" fill="url(#vinoOscuro)"/>
    <circle cx="122" cy="148" r="3.5" fill="url(#vinoPetalo)"/>
    <circle cx="102" cy="148" r="3" fill="url(#oro)"/>
    <circle cx="75" cy="100" r="4" fill="url(#oro)"/>
    <circle cx="85" cy="108" r="3" fill="url(#vinoOscuro)"/>
  </g>

  <!-- Ramitas derecha -->
  <g opacity="0.95">
    <!-- Tallo derecho -->
    <path d="M340 130 C 400 125, 480 110, 550 145" stroke="#5a765e" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M410 123 C 450 95, 500 80, 560 85" stroke="#5a765e" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Hojas derecha alargadas eucalipto -->
    <path d="M550 145 C 570 130, 555 110, 530 125 C 510 138, 530 155, 550 145 Z" fill="url(#eucalipto)" />
    <path d="M505 120 C 525 100, 505 80, 485 100 C 470 115, 485 135, 505 120 Z" fill="url(#eucaliptoClaro)" />
    <path d="M460 120 C 480 95, 465 75, 440 95 C 420 110, 440 135, 460 120 Z" fill="url(#eucalipto)" />
    <path d="M560 85 C 580 70, 565 50, 540 65 C 520 78, 540 95, 560 85 Z" fill="url(#eucaliptoClaro)" />
    <path d="M515 83 C 530 60, 510 40, 490 60 C 475 75, 495 95, 515 83 Z" fill="url(#eucalipto)" />
    <path d="M465 95 C 480 70, 460 50, 440 70 C 425 85, 445 105, 465 95 Z" fill="url(#eucaliptoClaro)" />

    <!-- Bayas doradas y vino derecha -->
    <circle cx="490" cy="140" r="4.5" fill="url(#vinoOscuro)"/>
    <circle cx="478" cy="148" r="3.5" fill="url(#vinoPetalo)"/>
    <circle cx="498" cy="148" r="3" fill="url(#oro)"/>
    <circle cx="525" cy="100" r="4" fill="url(#oro)"/>
    <circle cx="515" cy="108" r="3" fill="url(#vinoOscuro)"/>
  </g>

  <!-- ================= FLORES SECUNDARIAS (LATERALES) ================= -->
  <!-- Peonía Rosa Empolvado (Izquierda) -->
  <g transform="translate(210, 115) rotate(-15)" filter="url(#softShadow)">
    <!-- Pétalos exteriores -->
    <path d="M-40 0 C -45 -30, -15 -45, 0 -35 C 15 -45, 45 -30, 40 0 C 45 30, 15 45, 0 35 C -15 45, -45 30, -40 0 Z" fill="url(#rosaRubor)" opacity="0.9" />
    <path d="M-30 -10 C -35 -35, 0 -40, 10 -20 C 30 -35, 40 -10, 25 15 C 30 35, 0 40, -15 25 C -35 25, -35 0, -30 -10 Z" fill="url(#rosaRubor)" />
    <!-- Capas interiores y pliegues -->
    <path d="M-18 -8 C -22 -22, 5 -25, 12 -12 C 22 -20, 26 -2, 16 12 C 18 24, -2 24, -10 15 C -22 14, -20 2, -18 -8 Z" fill="#fff" opacity="0.4" />
    <path d="M-12 -5 C -15 -15, 5 -18, 8 -8 C 15 -12, 18 0, 10 10 C 10 18, -2 18, -6 10 C -15 10, -14 0, -12 -5 Z" fill="url(#vinoPetalo)" opacity="0.75" />
    <!-- Centro -->
    <circle cx="0" cy="0" r="6" fill="url(#oro)" />
  </g>

  <!-- Capullo Borgoña Profundo (Derecha) -->
  <g transform="translate(390, 120) rotate(20)" filter="url(#softShadow)">
    <path d="M-35 0 C -40 -25, -10 -40, 0 -30 C 10 -40, 40 -25, 35 0 C 40 25, 10 40, 0 30 C -10 40, -40 25, -35 0 Z" fill="url(#vinoOscuro)" />
    <path d="M-25 -5 C -30 -25, 0 -30, 10 -15 C 25 -25, 30 -5, 20 15 C 22 30, 0 32, -12 20 C -25 20, -28 5, -25 -5 Z" fill="url(#vinoPetalo)" />
    <path d="M-14 -4 C -18 -16, 5 -18, 10 -8 C 18 -14, 20 0, 12 10 C 12 18, -2 18, -6 10 C -15 10, -16 2, -14 -4 Z" fill="url(#rosaRubor)" opacity="0.7" />
    <circle cx="2" cy="1" r="5" fill="url(#oro)" />
  </g>

  <!-- ================= ROSA CENTRAL PROTAGONISTA (VINO & ROSA) ================= -->
  <g transform="translate(300, 125)" filter="url(#softShadow)">
    <!-- Hojas de fondo de la rosa central -->
    <path d="M-55 -40 C -70 -70, -30 -80, -15 -55 C -5 -35, -35 -20, -55 -40 Z" fill="url(#eucalipto)" />
    <path d="M55 -40 C 70 -70, 30 -80, 15 -55 C 5 -35, 35 -20, 55 -40 Z" fill="url(#eucaliptoClaro)" />
    <path d="M-10 65 C -20 95, 20 95, 10 65 Z" fill="url(#eucalipto)" />

    <!-- Pétalos Exteriores de Rosa Grande -->
    <path d="M -60 -10 C -75 -45, -30 -70, 0 -58 C 30 -70, 75 -45, 60 -10 C 80 30, 40 65, 0 62 C -40 65, -80 30, -60 -10 Z" fill="url(#vinoOscuro)" />
    <path d="M -50 -5 C -62 -35, -20 -55, 0 -45 C 20 -55, 62 -35, 50 -5 C 65 25, 30 52, 0 48 C -30 52, -65 25, -50 -5 Z" fill="url(#vinoPetalo)" />
    
    <!-- Capa intermedia ondulada de pétalos con brillo rosado -->
    <path d="M -38 -20 C -45 -40, -10 -45, 0 -35 C 10 -45, 45 -40, 38 -20 C 48 5, 25 35, 0 32 C -25 35, -48 5, -38 -20 Z" fill="url(#rosaRubor)" opacity="0.85" />
    <path d="M -30 -15 C -35 -30, -5 -35, 0 -25 C 5 -35, 35 -30, 30 -15 C 38 5, 18 25, 0 22 C -18 25, -38 5, -30 -15 Z" fill="url(#vinoPetalo)" />

    <!-- Corazón espiral de la rosa -->
    <path d="M -20 -10 C -25 -22, -2 -24, 0 -16 C 2 -24, 25 -22, 20 -10 C 24 5, 12 16, 0 14 C -12 16, -24 5, -20 -10 Z" fill="url(#vinoOscuro)" />
    <path d="M -12 -6 C -15 -14, 0 -16, 0 -10 C 2 -16, 15 -14, 12 -6 C 15 3, 6 10, 0 8 C -6 10, -15 3, -12 -6 Z" fill="url(#rosaRubor)" opacity="0.9" />
    <path d="M -6 -3 C -8 -8, 0 -9, 0 -5 C 2 -9, 8 -8, 6 -3 C 8 2, 3 5, 0 4 C -3 5, -8 2, -6 -3 Z" fill="url(#vinoOscuro)" />

    <!-- Estambres dorados en el centro -->
    <circle cx="-2" cy="-1" r="2" fill="url(#oro)" />
    <circle cx="3" cy="1" r="1.5" fill="url(#oro)" />
    <circle cx="0" cy="3" r="1.5" fill="url(#oro)" />
  </g>

  <!-- Destellos dorados festivos -->
  <g fill="url(#oro)" opacity="0.85">
    <path d="M170 60 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z" />
    <path d="M430 60 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z" />
    <path d="M300 35 l2.5 6 6 2.5 -6 2.5 -2.5 6 -2.5 -6 -6 -2.5 6 -2.5z" />
    <circle cx="250" cy="50" r="1.5" />
    <circle cx="350" cy="50" r="1.5" />
  </g>
</svg>
