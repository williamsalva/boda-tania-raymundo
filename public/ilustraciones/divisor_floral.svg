<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 80" fill="none">
  <defs>
    <!-- Gradientes Pétalos -->
    <radialGradient id="divVinoPetalo" cx="40%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#c94a91" />
      <stop offset="50%" stop-color="#9b2548" />
      <stop offset="100%" stop-color="#5a0e24" />
    </radialGradient>
    <radialGradient id="divRosaRubor" cx="45%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fff5f8" />
      <stop offset="50%" stop-color="#f5c2d8" />
      <stop offset="100%" stop-color="#b02a80" />
    </radialGradient>

    <!-- Gradientes Hojas -->
    <linearGradient id="divEucalipto" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#96b299" />
      <stop offset="50%" stop-color="#648369" />
      <stop offset="100%" stop-color="#46604a" />
    </linearGradient>

    <!-- Oro Sutil -->
    <linearGradient id="divOro" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf4db" />
      <stop offset="50%" stop-color="#dfb76c" />
      <stop offset="100%" stop-color="#a87f32" />
    </linearGradient>
  </defs>

  <!-- Líneas sutiles de conexión en degradé hacia los extremos -->
  <line x1="20" y1="40" x2="180" y2="40" stroke="url(#divOro)" stroke-width="1" opacity="0.6" />
  <line x1="320" y1="40" x2="480" y2="40" stroke="url(#divOro)" stroke-width="1" opacity="0.6" />
  <circle cx="20" cy="40" r="2" fill="url(#divOro)" opacity="0.8" />
  <circle cx="480" cy="40" r="2" fill="url(#divOro)" opacity="0.8" />

  <!-- ================= RAMITAS LATERALES ================= -->
  <!-- Izquierda -->
  <g opacity="0.9">
    <path d="M 230 40 C 200 38, 170 32, 140 45" stroke="#5a765e" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M 140 45 C 130 35, 145 22, 160 32 C 172 40, 155 52, 140 45 Z" fill="url(#divEucalipto)" />
    <path d="M 180 34 C 170 20, 185 10, 198 22 C 208 30, 195 42, 180 34 Z" fill="url(#divEucalipto)" />
    <circle cx="165" cy="46" r="2.8" fill="url(#divVinoPetalo)" />
    <circle cx="195" cy="45" r="2.2" fill="url(#divOro)" />
  </g>

  <!-- Derecha -->
  <g opacity="0.9">
    <path d="M 270 40 C 300 38, 330 32, 360 45" stroke="#5a765e" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M 360 45 C 370 35, 355 22, 340 32 C 328 40, 345 52, 360 45 Z" fill="url(#divEucalipto)" />
    <path d="M 320 34 C 330 20, 315 10, 302 22 C 292 30, 305 42, 320 34 Z" fill="url(#divEucalipto)" />
    <circle cx="335" cy="46" r="2.8" fill="url(#divVinoPetalo)" />
    <circle cx="305" cy="45" r="2.2" fill="url(#divOro)" />
  </g>

  <!-- ================= CAPULLOS Y BOTONES ================= -->
  <!-- Florcita Rubor Izquierda -->
  <g transform="translate(225, 38) scale(0.65)">
    <path d="M-20 0 C -24 -15, -6 -22, 0 -16 C 6 -22, 24 -15, 20 0 C 24 15, 6 22, 0 16 C -6 22, -24 15, -20 0 Z" fill="url(#divRosaRubor)" />
    <circle cx="0" cy="0" r="3" fill="url(#divOro)" />
  </g>

  <!-- Florcita Rubor Derecha -->
  <g transform="translate(275, 38) scale(0.65)">
    <path d="M-20 0 C -24 -15, -6 -22, 0 -16 C 6 -22, 24 -15, 20 0 C 24 15, 6 22, 0 16 C -6 22, -24 15, -20 0 Z" fill="url(#divRosaRubor)" />
    <circle cx="0" cy="0" r="3" fill="url(#divOro)" />
  </g>

  <!-- Flor Central Borgoña -->
  <g transform="translate(250, 40) scale(0.85)">
    <path d="M -30 -4 C -38 -20, -12 -30, 0 -24 C 12 -30, 38 -20, 30 -4 C 38 14, 16 28, 0 26 C -16 28, -38 14, -30 -4 Z" fill="url(#divVinoPetalo)" />
    <path d="M -18 -8 C -22 -18, -4 -20, 0 -14 C 4 -20, 22 -18, 18 -8 C 22 2, 12 14, 0 12 C -12 14, -22 2, -18 -8 Z" fill="url(#divRosaRubor)" opacity="0.8" />
    <circle cx="0" cy="0" r="2.5" fill="url(#divOro)" />
  </g>

  <!-- Destello central -->
  <path d="M 250 16 l1.5 3 3 1.5 -3 1.5 -1.5 3 -1.5 -3 -3 -1.5 3 -1.5z" fill="url(#divOro)" opacity="0.9"/>
  <path d="M 250 64 l1.5 3 3 1.5 -3 1.5 -1.5 3 -1.5 -3 -3 -1.5 3 -1.5z" fill="url(#divOro)" opacity="0.9"/>
</svg>
