<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
  <defs>
    <!-- Gradiente Pétalo Flor Grande -->
    <radialGradient id="petaloRosa" cx="30%" cy="25%" r="75%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#fde8ee" />
      <stop offset="70%" stop-color="#f6bfcf" />
      <stop offset="100%" stop-color="#e38fa7" />
    </radialGradient>

    <!-- Gradiente Pétalo Sombra/Profundidad -->
    <radialGradient id="petaloSombra" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fae1e8" />
      <stop offset="50%" stop-color="#e89cb1" />
      <stop offset="100%" stop-color="#c96d86" />
    </radialGradient>

    <!-- Gradiente Pétalo Capullo / Flor Pequeña -->
    <radialGradient id="petaloCapullo" cx="25%" cy="25%" r="80%">
      <stop offset="0%" stop-color="#fff0f4" />
      <stop offset="50%" stop-color="#f8cad8" />
      <stop offset="100%" stop-color="#db7e98" />
    </radialGradient>

    <!-- Gradiente Ramita / Tallo -->
    <linearGradient id="tallo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c49a88" />
      <stop offset="50%" stop-color="#9a7060" />
      <stop offset="100%" stop-color="#734e40" />
    </linearGradient>

    <!-- Gradiente Hojitas Salvia Suave -->
    <linearGradient id="hoja" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4e3d3" />
      <stop offset="60%" stop-color="#9eb69d" />
      <stop offset="100%" stop-color="#748d73" />
    </linearGradient>

    <!-- Centro Dorado Flor -->
    <radialGradient id="estambre" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fff8d6" />
      <stop offset="45%" stop-color="#e8b958" />
      <stop offset="85%" stop-color="#b87a2a" />
      <stop offset="100%" stop-color="#803d16" />
    </radialGradient>

    <filter id="flSombra" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="3" stdDeviation="4" flood-color="#542032" flood-opacity="0.18" />
    </filter>

    <filter id="petaloDrop" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#8a3050" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- ================= RAMITAS Y TALLOS ================= -->
  <g opacity="0.9">
    <!-- Tallo principal curvado desde la esquina inferior hacia arriba y afuera -->
    <path d="M 60 170 C 85 160, 120 165, 155 140 C 180 120, 195 85, 205 50" stroke="url(#tallo)" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 125 155 C 145 165, 175 180, 210 185" stroke="url(#tallo)" stroke-width="2" stroke-linecap="round" />
    <path d="M 90 165 C 80 185, 85 205, 95 220" stroke="url(#tallo)" stroke-width="1.8" stroke-linecap="round" />
    <path d="M 170 105 C 190 100, 215 95, 225 80" stroke="url(#tallo)" stroke-width="1.4" stroke-linecap="round" />
    <path d="M 160 170 C 180 185, 190 205, 195 225" stroke="url(#tallo)" stroke-width="1.4" stroke-linecap="round" />
  </g>

  <!-- ================= HOJITAS ================= -->
  <g opacity="0.85">
    <!-- Hojita arriba derecha -->
    <path d="M 195 75 C 185 60, 200 45, 212 55 C 220 65, 210 80, 195 75 Z" fill="url(#hoja)" />
    <!-- Hojita media derecha -->
    <path d="M 185 115 C 205 110, 215 125, 205 135 C 195 142, 180 130, 185 115 Z" fill="url(#hoja)" />
    <!-- Hojita abajo -->
    <path d="M 140 185 C 148 200, 138 215, 125 210 C 115 202, 128 188, 140 185 Z" fill="url(#hoja)" />
    <!-- Hojita abajo derecha -->
    <path d="M 175 195 C 190 205, 185 222, 172 220 C 160 215, 165 200, 175 195 Z" fill="url(#hoja)" />
  </g>

  <!-- ================= CAPULLOS Y BOTONES ================= -->
  <g filter="url(#flSombra)">
    <!-- Capullo superior (205, 50) -->
    <g transform="translate(205, 50) rotate(-20)">
      <path d="M 0 5 C -6 0, -5 -12, 0 -15 C 5 -12, 6 0, 0 5 Z" fill="url(#petaloCapullo)" />
      <path d="M -3 3 C -7 -2, -3 -10, 0 -13 C 3 -10, 6 -2, 3 3 Z" fill="url(#petaloRosa)" opacity="0.8" />
      <path d="M -4 5 C -2 1, 2 1, 4 5 C 2 7, -2 7, -4 5 Z" fill="url(#hoja)" />
    </g>

    <!-- Capullo medio alto (225, 80) -->
    <g transform="translate(225, 80) rotate(35)">
      <path d="M 0 4 C -5 0, -4 -9, 0 -12 C 4 -9, 5 0, 0 4 Z" fill="url(#petaloCapullo)" />
      <path d="M -2 2 C -5 -2, -2 -8, 0 -10 C 2 -8, 5 -2, 2 2 Z" fill="url(#petaloRosa)" opacity="0.8" />
      <path d="M -3 4 C -1 1, 1 1, 3 4 C 1 6, -1 6, -3 4 Z" fill="url(#hoja)" />
    </g>

    <!-- Capullo inferior (95, 220) -->
    <g transform="translate(95, 220) rotate(160)">
      <path d="M 0 4 C -5 0, -4 -9, 0 -12 C 4 -9, 5 0, 0 4 Z" fill="url(#petaloCapullo)" />
      <path d="M -3 4 C -1 1, 1 1, 3 4 Z" fill="url(#hoja)" />
    </g>

    <!-- Capullo abajo derecha (195, 225) -->
    <g transform="translate(195, 225) rotate(110)">
      <path d="M 0 4 C -5 0, -4 -10, 0 -13 C 4 -10, 5 0, 0 4 Z" fill="url(#petaloCapullo)" />
      <path d="M -3 4 C -1 1, 1 1, 3 4 Z" fill="url(#hoja)" />
    </g>
  </g>

  <!-- ================= FLOR LATERAL SUPERIOR (175, 95) ================= -->
  <g transform="translate(175, 95) rotate(15)" filter="url(#flSombra)">
    <!-- 5 Pétalos en flor de cerezo -->
    <!-- Pétalo Arriba -->
    <path d="M 0 -2 C -11 -6, -15 -22, -4 -30 C 0 -33, 4 -33, 8 -30 C 19 -22, 13 -6, 0 -2 Z" fill="url(#petaloSombra)" filter="url(#petaloDrop)" />
    <!-- Pétalo Derecha Arriba -->
    <path d="M 2 0 C 6 -10, 22 -14, 29 -3 C 32 1, 31 5, 28 9 C 19 19, 5 11, 2 0 Z" fill="url(#petaloRosa)" filter="url(#petaloDrop)" />
    <!-- Pétalo Derecha Abajo -->
    <path d="M 1 2 C 7 7, 16 23, 6 29 C 2 32, -2 31, -6 28 C -15 18, -6 6, 1 2 Z" fill="url(#petaloRosa)" filter="url(#petaloDrop)" />
    <!-- Pétalo Izquierda Abajo -->
    <path d="M -2 1 C -7 7, -22 13, -28 3 C -31 -1, -30 -5, -27 -9 C -18 -17, -5 -7, -2 1 Z" fill="url(#petaloSombra)" filter="url(#petaloDrop)" />
    <!-- Pétalo Izquierda Arriba -->
    <path d="M -1 -2 C -7 -7, -19 -2, -24 -12 C -26 -16, -24 -19, -20 -21 C -10 -25, -2 -12, -1 -2 Z" fill="url(#petaloRosa)" filter="url(#petaloDrop)" />

    <!-- Centro y estambres -->
    <circle cx="0" cy="0" r="4.5" fill="url(#estambre)" />
    <!-- Pistilos diminutos -->
    <circle cx="-5" cy="-4" r="1" fill="#9a3652" />
    <circle cx="4" cy="-5" r="1" fill="#9a3652" />
    <circle cx="6" cy="3" r="1" fill="#9a3652" />
    <circle cx="-3" cy="6" r="1" fill="#9a3652" />
    <circle cx="-6" cy="1" r="1" fill="#9a3652" />
    <circle cx="0" cy="0" r="2.2" fill="#fff" opacity="0.6" />
  </g>

  <!-- ================= FLOR LATERAL DERECHA (185, 165) ================= -->
  <g transform="translate(185, 165) rotate(45)" filter="url(#flSombra)">
    <path d="M 0 -2 C -10 -5, -13 -18, -3 -25 C 0 -28, 4 -28, 7 -25 C 16 -18, 11 -5, 0 -2 Z" fill="url(#petaloRosa)" />
    <path d="M 2 0 C 6 -8, 18 -11, 24 -2 C 27 1, 26 5, 23 8 C 16 16, 4 9, 2 0 Z" fill="url(#petaloSombra)" />
    <path d="M 1 2 C 6 6, 13 19, 5 24 C 1 27, -2 26, -5 23 C -13 15, -5 5, 1 2 Z" fill="url(#petaloRosa)" />
    <path d="M -2 1 C -6 6, -18 11, -23 2 C -26 -1, -25 -4, -22 -7 C -15 -14, -4 -6, -2 1 Z" fill="url(#petaloRosa)" />
    <path d="M -1 -2 C -6 -6, -16 -2, -20 -10 C -22 -13, -20 -16, -17 -17 C -8 -21, -2 -10, -1 -2 Z" fill="url(#petaloSombra)" />
    <circle cx="0" cy="0" r="3.8" fill="url(#estambre)" />
    <circle cx="0" cy="0" r="1.8" fill="#fff" opacity="0.6" />
  </g>

  <!-- ================= FLOR CENTRAL PRINCIPAL (GRANDE, PROTAGONISTA) ================= -->
  <g transform="translate(115, 140) rotate(-8)" filter="url(#flSombra)">
    <!-- 5 Pétalos sedosos de cerezo con muesca sutil en el borde -->
    <!-- Pétalo 1: Superior Central -->
    <g filter="url(#petaloDrop)">
      <path d="M 0 -3 C -16 -10, -22 -35, -7 -46 C -1 -50, 4 -50, 10 -46 C 24 -35, 18 -10, 0 -3 Z" fill="url(#petaloRosa)" />
      <!-- Muesca delicada de cerezo en la punta -->
      <path d="M -2 -47 C 0 -44, 3 -44, 5 -47" stroke="#e8a2b5" stroke-width="1.5" stroke-linecap="round" fill="none" />
      <path d="M 0 -5 C -6 -16, -8 -28, -2 -38" stroke="#f6cad7" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.7" />
    </g>

    <!-- Pétalo 2: Superior Derecho -->
    <g filter="url(#petaloDrop)">
      <path d="M 3 -1 C 11 -15, 34 -20, 44 -5 C 49 1, 48 8, 43 14 C 29 28, 9 16, 3 -1 Z" fill="url(#petaloRosa)" />
      <path d="M 44 -1 C 41 2, 42 6, 45 9" stroke="#e8a2b5" stroke-width="1.5" stroke-linecap="round" fill="none" />
      <path d="M 4 0 C 15 -4, 27 -5, 36 2" stroke="#f6cad7" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.7" />
    </g>

    <!-- Pétalo 3: Inferior Derecho -->
    <g filter="url(#petaloDrop)">
      <path d="M 2 3 C 12 11, 25 35, 9 44 C 3 48, -4 47, -10 42 C -23 27, -9 9, 2 3 Z" fill="url(#petaloSombra)" />
      <path d="M 5 44 C 2 41, -2 41, -5 44" stroke="#d48098" stroke-width="1.5" stroke-linecap="round" fill="none" />
    </g>

    <!-- Pétalo 4: Inferior Izquierdo -->
    <g filter="url(#petaloDrop)">
      <path d="M -3 2 C -12 12, -35 18, -43 3 C -47 -3, -45 -10, -40 -16 C -27 -26, -8 -10, -3 2 Z" fill="url(#petaloRosa)" />
      <path d="M -43 0 C -40 -3, -40 -7, -43 -9" stroke="#e8a2b5" stroke-width="1.5" stroke-linecap="round" fill="none" />
      <path d="M -4 2 C -15 6, -26 6, -34 -2" stroke="#f6cad7" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.7" />
    </g>

    <!-- Pétalo 5: Superior Izquierdo -->
    <g filter="url(#petaloDrop)">
      <path d="M -2 -3 C -11 -12, -28 -5, -34 -20 C -36 -26, -32 -31, -26 -33 C -11 -37, -2 -18, -2 -3 Z" fill="url(#petaloSombra)" />
      <path d="M -32 -23 C -30 -20, -28 -22, -28 -26" stroke="#d48098" stroke-width="1.5" stroke-linecap="round" fill="none" />
    </g>

    <!-- Centro Radiante con Estambres -->
    <g>
      <!-- Radios de estambres finos -->
      <line x1="0" y1="0" x2="-8" y2="-10" stroke="#b04364" stroke-width="1.2" />
      <line x1="0" y1="0" x2="3" y2="-12" stroke="#b04364" stroke-width="1.2" />
      <line x1="0" y1="0" x2="11" y2="-6" stroke="#b04364" stroke-width="1.2" />
      <line x1="0" y1="0" x2="12" y2="5" stroke="#b04364" stroke-width="1.2" />
      <line x1="0" y1="0" x2="6" y2="11" stroke="#b04364" stroke-width="1.2" />
      <line x1="0" y1="0" x2="-5" y2="11" stroke="#b04364" stroke-width="1.2" />
      <line x1="0" y1="0" x2="-11" y2="3" stroke="#b04364" stroke-width="1.2" />
      <line x1="0" y1="0" x2="-10" y2="-4" stroke="#b04364" stroke-width="1.2" />

      <!-- Anteras doradas en las puntas -->
      <circle cx="-8" cy="-10" r="1.6" fill="url(#estambre)" />
      <circle cx="3" cy="-12" r="1.6" fill="url(#estambre)" />
      <circle cx="11" cy="-6" r="1.6" fill="url(#estambre)" />
      <circle cx="12" cy="5" r="1.6" fill="url(#estambre)" />
      <circle cx="6" cy="11" r="1.6" fill="url(#estambre)" />
      <circle cx="-5" cy="11" r="1.6" fill="url(#estambre)" />
      <circle cx="-11" cy="3" r="1.6" fill="url(#estambre)" />
      <circle cx="-10" cy="-4" r="1.6" fill="url(#estambre)" />

      <!-- Núcleo central -->
      <circle cx="0" cy="0" r="6" fill="url(#estambre)" />
      <circle cx="-1" cy="-1" r="2.5" fill="#fff" opacity="0.75" />
    </g>
  </g>

  <!-- Pequeño pétalo suelto cayendo para dar naturalidad -->
  <g transform="translate(60, 195) rotate(25)" opacity="0.85" filter="url(#flSombra)">
    <path d="M 0 0 C -5 -8, -2 -14, 5 -12 C 10 -10, 8 -3, 0 0 Z" fill="url(#petaloRosa)" />
  </g>
</svg>
